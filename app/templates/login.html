<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login RH</title><style>body{font-family:Arial;background:#eef3f2;display:grid;place-items:center;height:100vh;margin:0}.box{background:#fff;padding:28px;width:340px;border-radius:12px;box-shadow:0 5px 25px #0002}h2{color:#075e54}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bbc;border-radius:6px}button{width:100%;padding:12px;background:#128c7e;color:#fff;border:0;border-radius:6px}.erro{color:#b3261e}</style></head><body><form class="box" method="post" action="/login"><h2>Acesso ao RH</h2>{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}<label>Usuário<input name="usuario" required autocomplete="username"></label><label>Senha<input type="password" name="senha" required autocomplete="current-password"></label><label>Código 2FA<input name="codigo_2fa" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button>Entrar</button></form></body></html>
