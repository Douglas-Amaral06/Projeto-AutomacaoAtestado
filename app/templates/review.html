<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisar #{{ item.id }}</title><style>body{font-family:Arial;margin:0;background:#f3f5f7}header{background:#075e54;color:#fff;padding:15px 24px}header a{color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px;height:calc(100vh - 100px)}iframe,.form{width:100%;height:100%;border:0;background:#fff;border-radius:9px;box-shadow:0 2px 8px #0001}.form{box-sizing:border-box;padding:20px;overflow:auto}label{display:block;margin:10px 0;font-size:13px}input,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #bbc;border-radius:5px}textarea{min-height:75px}.actions{display:flex;gap:10px;margin-top:15px;align-items:center}button{padding:11px 16px;border:0;border-radius:6px;color:#fff;background:#128c7e;cursor:pointer}.reject,.delete{background:#b3261e}.delete{margin-left:auto;font-size:18px}.confirm{border:0;border-radius:10px;padding:20px;box-shadow:0 5px 25px #0004;max-width:380px}.confirm::backdrop{background:#0008}.confirm-actions{display:flex;gap:10px;justify-content:flex-end}.cancel{background:#68737a}@media(max-width:900px){.grid{grid-template-columns:1fr;height:auto}iframe{height:60vh}}</style></head><body><header><a href="/">← Voltar</a> · Revisão do atestado #{{ item.id }}</header><main class="grid"><iframe title="Documento original" src="/atestados/{{ item.id }}/arquivo"></iframe><section class="form"><form method="post" action="/atestados/{{ item.id }}/revisar"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Nome<input name="nome" value="{{ item.nome or '' }}"></label><label>CPF<input name="cpf" value="{{ item.cpf or '' }}"></label><label>CID<input name="cid" value="{{ item.cid or '' }}"></label><label>Dias de afastamento<input type="number" min="0" name="dias_afastamento" value="{{ item.dias_afastamento or '' }}"></label><label>Data<input type="date" name="data_atestado" value="{{ item.data_atestado or '' }}"></label><label>Observações<textarea name="observacoes">{{ item.observacoes or '' }}</textarea></label><label>Motivo da rejeição<textarea name="motivo_rejeicao">{{ item.motivo_rejeicao or '' }}</textarea></label><div class="actions"><button name="acao" value="aprovar">Aprovar e salvar</button><button class="reject" name="acao" value="rejeitar">Rejeitar</button><button class="delete" type="button" popovertarget="confirmar-exclusao" title="Excluir atestado" aria-label="Excluir atestado">🗑</button></div></form><div id="confirmar-exclusao" class="confirm" popover><h3>Excluir este atestado?</h3><p>O registro, o documento salvo e a marcação de duplicidade serão removidos. Essa ação não pode ser desfeita.</p><div class="confirm-actions"><button class="cancel" type="button" popovertarget="confirmar-exclusao" popovertargetaction="hide">Não</button><form method="post" action="/atestados/{{ item.id }}/excluir"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="delete" type="submit">Sim, excluir</button></form></div></div></section></main></body></html>
