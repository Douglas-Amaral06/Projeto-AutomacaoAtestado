<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs</title><style>body{font-family:Arial;margin:0;background:#f3f5f7}header{background:#075e54;color:#fff;padding:16px 25px}header a{color:#fff}main{padding:20px}.log{background:#fff;border-left:5px solid #128c7e;margin-bottom:8px;padding:12px}.erro{border-color:#b3261e}.aviso{border-color:#c77800}.meta{font-size:12px;color:#667}pre{white-space:pre-wrap;font-size:12px}</style></head><body><header><a href="/">← Painel</a> · Auditoria</header><main>{% if not logs %}<div class="log">Nenhum evento.</div>{% endif %}{% for item in logs %}<section class="log {{ item.nivel }}"><div class="meta">#{{ item.id }} · {{ item.criado_em }} · {{ item.nivel }} · {{ item.evento }}</div><strong>{{ item.mensagem }}</strong>{% if item.detalhes %}<pre>{{ item.detalhes }}</pre>{% endif %}</section>{% endfor %}</main></body></html>
