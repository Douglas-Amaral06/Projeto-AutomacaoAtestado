<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; width: 320px; padding: 16px; color: #17202a; }
    h3 { margin: 0 0 8px; color: #075e54; }
    p { font-size: 13px; line-height: 1.4; }
    input { width: 100%; margin: 8px 0 12px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #128c7e; color: white; cursor: pointer; }
    button:disabled { opacity: .5; }
    #status { margin-top: 12px; font-size: 12px; white-space: pre-wrap; }
    a { color: #075e54; }
  </style>
</head>
<body>
  <h3>Processar atestado</h3>
  <p>Abra a conversa no WhatsApp Web, baixe o atestado recebido e selecione o arquivo abaixo.</p>
  <input id="file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp">
  <button id="send">Enviar para extracao</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
